<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exam9-16</title>
</head>
<script>
    function checkFilled(obj) {
        if (obj.value == "") {
            obj.focus();
        }
    }
</script>
<body onload="document.getElementById('name').focus();">
    <h3>onfocus onblur</h3>
    <hr>
    <p>이름을 입력하지 않고는 학번을 입력할 수 없습니다.</p>
    <form>
        이름 <input type="text" id="name" onblur="checkFilled(this)">
        학번 <input type="text">
    </form>
</body>
</html>
