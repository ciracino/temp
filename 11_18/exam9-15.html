<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exam9-15</title>
</head>
<script>
    let files = [
        "media/file1.jpg",
        "media/file2.jpg",
        "media/file3.jpg",
        "media/file4.jpg"
    ];
    let imgs = new Array();
    for (let i  = 0; i < files.length; i++) {
        imgs[i] = new Image();
        imgs[i].src = files[i];
    }

    let next = 1;
    function change(img) {
        img.src = imgs[next].src;
        next++;
        next %= imgs.length;
    }
</script>
<body>
    <h3>new Image 로 이미지 로딩</h3>
    <hr>
    <img style="border: 20px rigid wheat" src="media/file1.jpg" alt="" width="200" height="200" onclick="change(this)">
</body>
</html>
