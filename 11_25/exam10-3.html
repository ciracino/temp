<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exam10-3</title>
</head>
<body>
    <h3>image focus setTime 5s -> navigate site</h3>
    <hr>
    <img id="img" src="media/image.jpg" alt="" onmouseover="startTimer(5000)" onmouseout="cancelTimer()">
</body>
<script>
    let timer = null;
    function startTimer(time) {
        timer = setTimeout("load('https://dafanew.com/animal/?bmode=view&idx=14755070')", time);

        document.getElementById("img").title = "타이머 작동 시작";
    }

    function cancelTimer() {
        clearTimeout(timer);
    }

    function load(url) {
        window.location = url;
    }
</script>
</html>
