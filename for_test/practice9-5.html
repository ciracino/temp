<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>practice9-5</title>
</head>
<script>
    let prev = null;
    window.onclick = function(e) {
        console.log("click")
        if (e.target.tagName.toLowerCase() != "li") {
            return;
        }
        e.target.style.fontSize = "1.3em";
        if (prev != null) {
            prev.style.fontSize = "1em";
        }
        prev = e.target;
    }
</script>
<body>
    <h3>크기 1.3배</h3>
    <hr>
    <ul>
        <li>item1</li>
        <li>item2</li>
        <li>item3</li>
        <li>item4</li>
        <li>item5</li>
    </ul>
</body>
</html>
