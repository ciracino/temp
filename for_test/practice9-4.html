<script>
    let scale = 1;
    document.getElementById("image").onwhee = function(e) {
        e.preventDefault();
        if (e.wheelData > 0) {
            img.width -= img.width * 0.05;
            img.height -= img.height * 0.05;
        } else {
            img.width += img.width * 0.05;
            img.height += img.height * 0.05;
        }
    }
</script>
